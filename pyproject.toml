[project]
name = "slipstream"
version = "0.1.0"
description = "JS engine benchmark collector and analyzer"
# 3.11.4 for tarfile's extraction filter (PEP 706), which the bus
# consumer relies on; on 3.11.0-3.11.3 every unpack raises TypeError.
requires-python = ">=3.11.4"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    # Not an extra: a spanner target is the only way scores reach the perf
    # database, and the machine that cannot reach it spools for one that can.
    "google-cloud-spanner>=3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8",
    "pytest-xdist>=3",
]

# The suite is a few hundred small tests plus a handful that drive real git
# repos and real processes; spread over the cores it runs in a fraction of
# the serial time. Pass -n0 to run it in one process (for pdb, say).
[tool.pytest.ini_options]
addopts = "-n auto"
testpaths = ["tests"]

[project.scripts]
slipstream = "slipstream.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slipstream"]

# Resolve against PyPI regardless of what the machine's uv config says. A
# system-wide index (a corporate proxy, say) would otherwise be baked into
# uv.lock as the URL of every wheel, and the lock is public.
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
