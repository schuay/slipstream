[v8]
# sync_cmd runs before build_cmd, not instead of it: collapsing the two into
# one shell command gives one exit code for two steps, and a DEPS fetch failing
# is infrastructure while a compile failing is the commit's fault.
build_cmd = "autoninja -C out/release-lto d8"
sync_cmd = "gclient sync -RD"
binary_path = "out/release-lto/d8"
# d8 resolves both data files relative to the executable, not the cwd.
# snapshot_blob.bin is there because v8_use_external_startup_data defaults on
# everywhere but iOS; icudtl.dat because the build is i18n, and without it d8
# fails to start at all rather than only failing Intl.
run_set = [
    "out/release-lto/d8",
    "out/release-lto/icudtl.dat",
    "out/release-lto/snapshot_blob.bin",
]
id_regex = '^ *Cr-Commit-Position:.*#([0-9]+)'
path_filter = ""
gn_args = """
is_component_build = false
is_debug = false
target_cpu = "arm64"
v8_enable_verify_heap = false
dcheck_always_on = false
use_remoteexec = true
use_siso = true
is_official_build = true
chrome_pgo_phase = 0
thin_lto_enable_optimizations = true
use_thin_lto = true
v8_enable_google_benchmark = true
"""

# chrome's series is V8's as chromium took it in: the builder reads chromium's
# history for commits that move v8_revision in DEPS and expands each roll into
# the V8 commits it covers, checking out the roll CL and pinning src/v8 to
# each of them in turn. The keys are (chromium position, V8 position); nothing
# is built for chromium commits outside a roll.
[chrome]
embeds = "v8"
pin = "src/v8"
roll_file = "DEPS"
roll_regex = "'v8_revision': '([0-9a-f]{40})'"
build_cmd = "autoninja -C out/release-lto chrome"
sync_cmd = "gclient sync -RD"
build_dir = "out/release-lto"
binary_path = "out/release-lto/Chromium.app/Contents/MacOS/Chromium"
# The whole bundle: the framework, helpers and resources all live inside it
# and the binary finds them relative to itself.
run_set = [
    "out/release-lto/Chromium.app",
]
id_regex = '^ *Cr-Commit-Position:.*#([0-9]+)'
path_filter = ""
# An official build minus PGO, as closely as a non-official build can get.
#
# It cannot be official: the bots are not corp machines, and an official
# build pulls in things they have no access to. But is_official_build is not
# one flag, it is the default for a dozen others, and flipping it off flips
# those too: DCHECKs come on, thin LTO goes off, PartitionAlloc starts
# counting every allocation, stack variables get pattern-filled instead of
# zeroed. Each of those costs speed, so each one that matters for performance
# is set back to its official value by hand below. The rest of what official
# changes (branding, mojom id scrambling, ANGLE's null and wgpu backends) does
# not touch generated code and is left at its default. The clang plugin's
# raw_ptr checks are the one exception: official PartitionAlloc compiles
# RAW_PTR_EXCLUSION away, and the checks, left on, then reject every field
# that relied on it, so they go to their official setting too.
#
# PGO stays off as it is for d8; a profile that lags the tree by days would
# move the numbers on its own schedule.
#
# Validated by a full `gn args --list` diff against an official configuration
# and a real build; linux boxes additionally need use_mold = false (LTO wants
# lld), which is not listed because the arg is undeclared on mac and gn
# rejects unknown args.
gn_args = """
is_component_build = false
is_debug = false
target_cpu = "arm64"
is_official_build = false
use_remoteexec = true
use_siso = true
symbol_level = 0
is_chrome_branded = false
chrome_pgo_phase = 0
dcheck_always_on = false
use_thin_lto = true
thin_lto_enable_optimizations = true
init_stack_vars_zero = true
exclude_unwind_tables = true
partition_alloc_is_official_build = true
use_viz_debugger = false
enable_check_raw_ptr_fields = false
enable_check_raw_ref_fields = false
enable_check_container_fields = false
"""

# Linux notes (TODO: investigate and add a linux-jsc config):
#
# On Linux, override build_cmd to omit the macOS arm64e architecture option.
# The xcconfig pre_build_patches are no-ops (files don't exist on Linux), and
# DYLD_* vars are harmless.
# The main unknown is whether thin LTO is available on the Linux clang install.
#
# An alternative known-working Linux build (no LTO, used historically):
#   mkdir -p build && cd build
#   CXXFLAGS=-fno-omit-frame-pointer cmake -GNinja .. -DPORT=JSCOnly \
#     -DCMAKE_BUILD_TYPE=Release -DENABLE_STATIC_JSC=ON
#   ninja -j$(nproc) jsc
#   binary: build/bin/jsc  (static, no dyld_lib_path needed)
# To add LTO to the cmake build: -DLTO_MODE=thin (needs clang).
[jsc]
# Safari on Apple Silicon uses the arm64e ABI, including pointer authentication
# and JSC's architecture-specific JIT paths. The result arch remains the host's
# arm64 label; the build command is recorded through build_cfg_hash.
# Use Xcode directly: build-jsc currently consumes --architecture without
# forwarding it to make. A generic destination permits arm64e on an arm64 Mac.
build_cmd = "xcodebuild -workspace WebKit.xcworkspace -scheme \"Everything up to MiniBrowser\" -configuration Release -destination \"generic/platform=macOS\" ARCHS=arm64e VALID_ARCHS=arm64e SDKROOT=macosx WK_LTO_MODE=thin GCC_TREAT_WARNINGS_AS_ERRORS=NO SYMROOT=\"$PWD/WebKitBuild\" OBJROOT=\"$PWD/WebKitBuild\" SHARED_PRECOMPS_DIR=\"$PWD/WebKitBuild/PrecompiledHeaders\""
binary_path = "WebKitBuild/Release/jsc"
id_regex = 'Canonical link:.*/([0-9]+)@'
path_filter = "Source/JavaScriptCore"
dyld_lib_path = "WebKitBuild/Release"
# Matching browser runtime alongside the shell. XPC bundles and loose dylibs
# live outside frameworks and are targets of relative symlinks inside them.
# Keep complete bundles and paths for extraction on another benchmark host.
run_set = [
    "WebKitBuild/Release/jsc",
    "WebKitBuild/Release/MiniBrowser.app",
    "WebKitBuild/Release/JavaScriptCore.framework",
    "WebKitBuild/Release/WebCore.framework",
    "WebKitBuild/Release/WebKit.framework",
    "WebKitBuild/Release/WebKitLegacy.framework",
    "WebKitBuild/Release/WebInspectorUI.framework",
    "WebKitBuild/Release/WebGPU.framework",
    "WebKitBuild/Release/_WebKit_SwiftUI.framework",
    "WebKitBuild/Release/libANGLE-shared.dylib",
    "WebKitBuild/Release/libwebrtc.dylib",
    "WebKitBuild/Release/libWebKitSwift.dylib",
    "WebKitBuild/Release/com.apple.WebKit.Networking.xpc",
    "WebKitBuild/Release/com.apple.WebKit.WebContent.CaptivePortal.xpc",
    "WebKitBuild/Release/com.apple.WebKit.WebContent.xpc",
    "WebKitBuild/Release/com.apple.WebKit.WebContent.Development.xpc",
    "WebKitBuild/Release/com.apple.WebKit.Model.xpc",
    "WebKitBuild/Release/com.apple.WebKit.GPU.xpc",
    "WebKitBuild/Release/com.apple.WebKit.WebContent.EnhancedSecurity.xpc",
]
pre_build_patches = [
    "Source/JavaScriptCore/Configurations/Base.xcconfig",
    "Source/WTF/Configurations/Base.xcconfig",
]
